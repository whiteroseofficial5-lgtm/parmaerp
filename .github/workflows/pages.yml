name: Deploy demo to GitHub Pages

# The frontend runs entirely without a backend in demo mode, so the whole app can be
# shipped as static files. Each push to main rebuilds and republishes the preview at
# https://whiteroseofficial5-lgtm.github.io/parmaerp/
#
# The "Ensure the Pages site exists" step provisions the site if it is missing. Note the
# GitHub REST API distinction that broke this workflow before: `POST /repos/{o}/{r}/pages`
# *creates* the site, while `PUT` only *updates* one that already exists (and answers 404
# when there is none). The workflow's own `GITHUB_TOKEN` cannot create Pages sites at all
# ("Resource not accessible by integration"), so that step needs an admin PAT in the
# `PAGES_PAT` secret. With the site already created, this step is a no-op and the normal
# `GITHUB_TOKEN` is enough.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue them instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # ------------------------------------------------------------------
      # Fail fast, with an actionable message, when the Pages site is missing.
      # Only an admin token (PAGES_PAT) can create it; GITHUB_TOKEN cannot.
      # ------------------------------------------------------------------
      - name: Ensure the Pages site exists
        env:
          GH_TOKEN: ${{ secrets.PAGES_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${api}")

          if [ "$status" = "200" ]; then
            echo "Pages site already enabled."
            exit 0
          fi

          if [ "$status" = "404" ] && [ -n "${GH_TOKEN}" ]; then
            echo "Pages site missing — creating it via the PAGES_PAT admin token..."
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              "${api}" -d '{"build_type":"workflow"}')
            if [ "$code" = "201" ] || [ "$code" = "200" ]; then
              echo "Pages site created."
              exit 0
            fi
            echo "::error::Could not create the Pages site (API status ${code}). Check that the PAGES_PAT secret is an admin token."
            exit 1
          fi

          echo "::error::GitHub Pages is not enabled for ${GITHUB_REPOSITORY}."
          echo "::error::Enable it once at https://github.com/${GITHUB_REPOSITORY}/settings/pages (Source = GitHub Actions),"
          echo "::error::or add a repo-admin token as the PAGES_PAT secret so this workflow can create the site itself."
          exit 1

      - uses: actions/configure-pages@v6

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build static demo
        working-directory: frontend
        env:
          # Project sites are served from /<repo>/, so assets and links need that prefix.
          NEXT_PUBLIC_BASE_PATH: /parmaerp
          NEXT_PUBLIC_STATIC_EXPORT: 'true'
          NEXT_PUBLIC_DEMO_MODE: 'true'
        run: npm run build:static

      - name: Add .nojekyll
        working-directory: frontend
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5