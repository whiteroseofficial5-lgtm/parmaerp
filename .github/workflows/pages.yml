name: Deploy demo to GitHub Pages

# The frontend runs entirely without a backend in demo mode, so the whole app can be
# shipped as static files. Each push to main rebuilds and republishes the preview at
# https://whiteroseofficial5-lgtm.github.io/parmaerp/
#
# ONE-TIME SETUP: this repository's `has_pages` flag must be on before the workflow can
# publish. If the “Configure Pages” step fails, open Settings → Pages and set
#   Source = GitHub Actions
# then re-run this workflow (or push again). Creating the Pages site needs repository
# admin rights that the automatic GITHUB_TOKEN does not have, so it cannot be done from
# inside this workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue them instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build static demo
        working-directory: frontend
        env:
          # Project sites are served from /<repo>/, so assets and links need that prefix.
          NEXT_PUBLIC_BASE_PATH: /parmaerp
          NEXT_PUBLIC_STATIC_EXPORT: 'true'
          NEXT_PUBLIC_DEMO_MODE: 'true'
        run: npm run build:static

      - name: Add .nojekyll
        working-directory: frontend
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
