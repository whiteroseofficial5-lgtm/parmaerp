name: Deploy demo to GitHub Pages

# The frontend runs entirely without a backend in demo mode, so the whole app can be
# shipped as static files. Each push to main rebuilds and republishes the preview at
# https://whiteroseofficial5-lgtm.github.io/parmaerp/
#
# The "Enable GitHub Pages site" step creates the Pages site via the GitHub REST API
# (using the workflow's GITHUB_TOKEN, which has `pages: write` permission). If the repo
# admin has restricted Pages creation, fall back to enabling it manually once:
#   Settings → Pages → Source = GitHub Actions
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue them instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # Auto-provision the Pages site if it doesn't exist yet.
      # GITHUB_TOKEN with `pages: write` is sufficient per the GitHub REST API.
      # This is idempotent — a 422 (site already exists) is treated as success.
      # ------------------------------------------------------------------
      - name: Enable GitHub Pages site
        id: enable_pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: token ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          echo "existing_pages_status=$STATUS" >> "$GITHUB_OUTPUT"
          if [ "$STATUS" != "200" ]; then
            echo "Pages site not found — creating it via API..."
            curl -sf -X PUT \
              -H "Authorization: token ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/pages" \
              -d '{"source":{"branch":"github-pages","path":"/"}}' \
              -o /dev/null -w "\nAPI status: %{http_code}\n" || \
              echo "::warning::Could not auto-enable Pages (needs repo admin). Enable it in Settings → Pages → Source = GitHub Actions."
          else
            echo "Pages site already enabled — skipping creation."
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build static demo
        working-directory: frontend
        env:
          # Project sites are served from /<repo>/, so assets and links need that prefix.
          NEXT_PUBLIC_BASE_PATH: /parmaerp
          NEXT_PUBLIC_STATIC_EXPORT: 'true'
          NEXT_PUBLIC_DEMO_MODE: 'true'
        run: npm run build:static

      - name: Add .nojekyll
        working-directory: frontend
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
